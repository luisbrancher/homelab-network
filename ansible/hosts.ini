[network_devices]
cudy_ap ansible_host=10.10.10.5 ansible_user=root ansible_connection=ssh ansible_shell_type=sh ansible_ssh_transfer_method=piped ansible_ssh_pipelining=true

[opnsense]
n150 ansible_host=10.10.10.1 ansible_user=root

[network_devices:vars]
# configs globais de conexão SSH
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[opnsense:vars]
# configs globais de conexão SSH
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# Direciona o Ansible para o Python correto no FreeBSD
ansible_python_interpreter=/usr/local/bin/python3
# Credenciais para os módulos de API (Firewall, VLAN, DHCP)
opnsense_api_key="{{ vault_opnsense_api_key }}"
opnsense_api_secret="{{ vault_opnsense_api_secret }}"
ansible_password="{{ vault_ansible_password }}"
opnsense_url=https://10.10.10.1/api
validate_certs=false
ansible_become_password="{{ vault_ansible_password }}"